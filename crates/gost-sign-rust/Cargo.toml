[package]
name = "gost-sign-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
crypto-bigint = { version = "0.7.5", features = ["subtle", "zeroize"] }
subtle = "2"
zeroize = "1"
getrandom = "0.3"
der = { version = "0.8", features = ["derive"] }
pkcs8 = "0.11"
gost-sign-core = { path = "../gost-sign-core" }
gost-sign-cms = { path = "../gost-sign-cms" }
gost-sign-pfx = { path = "../gost-sign-pfx" }
gost-sign-export = { path = "../gost-sign-export", optional = true }
rpassword = { version = "7", optional = true }
tempfile = { version = "3", optional = true }

[features]
cli = ["dep:gost-sign-export", "dep:rpassword", "dep:tempfile"]
pcsc = ["cli", "gost-sign-export/pcsc"]

[lints]
workspace = true

[dev-dependencies]
gost-sign-export = { path = "../gost-sign-export" }
gost-sign-experimental = { path = "../gost-sign-experimental" }

[[bin]]
name = "gost-sign"
path = "src/bin/gost-sign.rs"
required-features = ["cli"]

[[example]]
name = "export_container"
required-features = ["cli"]

[[example]]
name = "sign_pfx"
required-features = ["cli"]
