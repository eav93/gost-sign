name: PHP-модули
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
permissions:
  contents: read
jobs:
  extension:
    name: PHP ${{ matrix.php }} / ${{ matrix.platform.name }} / ${{ matrix.platform.thread }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        platform:
          - {os: ubuntu-24.04, name: linux-x86_64, thread: nts}
          - {os: ubuntu-24.04-arm, name: linux-aarch64, thread: nts}
          - {os: macos-15-intel, name: macos-x86_64, thread: nts}
          - {os: macos-15, name: macos-aarch64, thread: nts}
          - {os: windows-2025, name: windows-x86_64, thread: nts}
          - {os: windows-2025, name: windows-x86_64, thread: ts}
    runs-on: ${{ matrix.platform.os }}
    env:
      phpts: ${{ matrix.platform.thread }}
      PHP_VERSION: ${{ matrix.php }}
      PACKAGE_PLATFORM: ${{ matrix.platform.name }}
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'Windows'
        with:
          toolchain: '1.98'
      - uses: dtolnay/rust-toolchain@nightly
        if: runner.os == 'Windows'
      - name: Сборка Unix
        if: runner.os != 'Windows'
        run: |
          cargo build --locked --release -p gost-sign-php
          cargo run --locked --release -p gost-sign-rust --example create_public_pfx -- target/php-public-test.pfx
      - name: Сборка Windows
        if: runner.os == 'Windows'
        run: |
          cargo +nightly build --locked --release -p gost-sign-php
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +nightly run --locked --release -p gost-sign-rust --example create_public_pfx -- target/php-public-test.pfx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Проверка и упаковка Unix
        if: runner.os != 'Windows'
        run: bash scripts/package-php.sh
      - name: Проверка и упаковка Windows
        if: runner.os == 'Windows'
        run: ./scripts/package-php.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: gost-sign-php${{ matrix.php }}-${{ matrix.platform.name }}-${{ matrix.platform.thread }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
